  <defs>
    <clipPath id="photoCrop">
      <rect width="180" height="180" rx="40" />
    </clipPath>
  </defs>
  <rect width="180" height="180" rx="40" fill="#14161b" />
  <image href="/profile-img.jpg" width="180" height="180" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoCrop)" />
</svg>
